
name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          if [[ ! "$PACKAGE_NAME" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]]; then
            echo "Invalid package name"
            exit 1
          fi

          chmod +x ./gradlew

          sed -i "s|moduleDescription = \"|moduleDescription = \"($PACKAGE_NAME) |g" module.gradle

          sed -i "s|com.game.packagename|$PACKAGE_NAME|g" module/src/main/cpp/game.h

          ./gradlew :module:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper
          path: out/magisk_module_release/
